name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.6.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-field-timesheet-v1.0.6-apk
          path: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.6.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.6
          name: AK Field Timesheet APK v1.0.6 (English Modals & Safe-Area Header)
          body: |
            ## 📱 AK Field Timesheet Android APK (v1.0.6)
            
            ### ✨ What's New in this Build:
            - **Mobile Header Safe-Area & Touch Optimization**: Generous status bar clearance (`pt-[max(env(safe-area-inset-top),24px)]`) and enlarged 44px touch targets ensure the 3-line hamburger menu is effortlessly tapable without device status bar overlap.
            - **Professional English Security Verification**: Translated exit and app-resume dialogs to clean, professional English.
            - **Slide-out Navigation Drawer**: Fast navigation between Dashboard, Timesheet Log, Approvals, Profile, and Settings.
          files: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
