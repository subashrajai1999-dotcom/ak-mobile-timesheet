name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.7.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-field-timesheet-v1.0.7-apk
          path: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.7.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.7
          name: AK Field Timesheet APK v1.0.7 (Auto Load Today's Saved Record & Update Support)
          body: |
            ## 📱 AK Field Timesheet Android APK (v1.0.7)
            
            ### ✨ What's New in this Build:
            - **Auto-Load Saved Record**: When opening Time & Attendance or picking a date, the app automatically checks if a record was already saved in PostgreSQL for that date and pre-fills all data (Project, Hours, Status, Remarks).
            - **Live DB Status Banner**: Shows "Today's Record Already Saved (In DB)" with current approval status.
            - **Update Record Support**: Allows instant editing/updating with "UPDATE RECORD" button.
            - **Header Safe-Area & Touch Optimization**: Generous status bar clearance with 44px hamburger menu touch target.
          files: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
