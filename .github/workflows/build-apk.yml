name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.3.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-field-timesheet-v1.0.3-apk
          path: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.3.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.3
          name: AK Field Timesheet APK v1.0.3 (Updated Header & Captcha)
          body: |
            ## 📱 AK Field Timesheet Android APK (v1.0.3)
            
            ### ✨ What's New in this Build:
            - **Non-Overlapping Header**: Redesigned role badge (`PM`, `SE`, `SUP`) so it never squishes the title or logout button.
            - **Prominent Sign Out**: Big 38x38px red touch button with native in-app confirmation modal.
            - **Security Captcha**: New dynamic alphanumeric Captcha with refresh button on login page.
            - **Alternative Logout**: Added sign-out button inside Settings page.
            
            > **Important**: If you already have the previous version on your phone, please **UNINSTALL the old app first**, then install this new APK!
          files: android/app/build/outputs/apk/debug/AK-Field-Timesheet-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
