services:
  - type: static_site
    name: ak-mobile-timesheet
    runtime: static
    plan: free
    region: oregon
    repo: https://github.com/subashrajai1999-dotcom/ak-mobile-timesheet
    branch: master
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
